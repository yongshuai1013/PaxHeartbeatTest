name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Build patched IDevice xcframework (UPSTREAM 0.1.66 + FORENSICS)
        run: |
          # 源頭版鑑識：idevice 改用上游 jkcoxson/idevice v0.1.66（版本血緣單變量對照）
          # 補丁：不改任何收發行為，只逐連線記錄每筆 lockdown/AFC 交換
          # （步驟／字節／毫秒／死點），經 FFI callback 送進 App 日誌畫面
          git clone --depth 1 --branch v0.1.66 https://github.com/jkcoxson/idevice.git /tmp/idevice-src
          git -C /tmp/idevice-src apply "$GITHUB_WORKSPACE/patches/idevice-forensics.patch"
          echo "FORENSICS markers in patched lib.rs:"
          grep -c "FORENSICS" /tmp/idevice-src/idevice/src/lib.rs
          ls /tmp/idevice-src/idevice/src/forensics.rs /tmp/idevice-src/ffi/src/forensics.rs
          rustup target add aarch64-apple-ios
          cd /tmp/idevice-src/ffi
          BINDGEN_EXTRA_CLANG_ARGS="--sysroot=$(xcrun --sdk iphoneos --show-sdk-path)" \
            IPHONEOS_DEPLOYMENT_TARGET=17.0 \
            cargo build --release --target aarch64-apple-ios --features obfuscate
          ls -lh /tmp/idevice-src/target/aarch64-apple-ios/release/libidevice_ffi.a
          mkdir -p /tmp/idevice-headers
          cp /tmp/idevice-src/ffi/idevice.h /tmp/idevice-headers/
          cp /tmp/idevice-src/swift/include/module.modulemap /tmp/idevice-headers/
          # MINIMUXER 共存：minimuxer 套件自帶的 IDevice.xcframework 也是 clang module "IDevice"，
          # 我方模組改名 IDeviceFFI 避免同名模組衝突（僅改 modulemap 名，標頭與行為不動）
          sed -i '' 's/^module IDevice {/module IDeviceFFI {/' /tmp/idevice-headers/module.modulemap
          grep "^module" /tmp/idevice-headers/module.modulemap
          mkdir -p "$GITHUB_WORKSPACE/Libraries"
          rm -rf "$GITHUB_WORKSPACE/Libraries/IDeviceFFI.xcframework"
          xcodebuild -create-xcframework \
            -library /tmp/idevice-src/target/aarch64-apple-ios/release/libidevice_ffi.a \
            -headers /tmp/idevice-headers \
            -output "$GITHUB_WORKSPACE/Libraries/IDeviceFFI.xcframework"
          ls -R "$GITHUB_WORKSPACE/Libraries/IDeviceFFI.xcframework"
      
      - name: Install XcodeGen
        run: brew install xcodegen
      
      - name: Generate project
        run: xcodegen generate

      - name: Resolve packages (record pins)
        run: |
          xcodebuild -resolvePackageDependencies -project PaxHeartbeatTest.xcodeproj -scheme PaxHeartbeatTest || true
          echo "=== Package.resolved ==="
          cat PaxHeartbeatTest.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved 2>/dev/null || find . -name Package.resolved -not -path "./Dependencies/*" | head -3
      
      - name: Build IPA
        run: |
          xcodebuild archive \
            -project PaxHeartbeatTest.xcodeproj \
            -scheme PaxHeartbeatTest \
            -destination 'generic/platform=iOS' \
            -archivePath build/PaxHeartbeatTest.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            SKIP_INSTALL=NO
          
          # 手動打包 IPA（未簽名，TrollStore 可裝）
          mkdir -p build/Payload
          cp -R build/PaxHeartbeatTest.xcarchive/Products/Applications/PaxHeartbeatTest.app build/Payload/
          cd build && zip -r PaxHeartbeatTest.ipa Payload/
      
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: PaxHeartbeatTest-ipa
          path: build/PaxHeartbeatTest.ipa
