name: PaxHeartbeatTest

options:
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true

packages:
  swift-nio:
    url: https://github.com/apple/swift-nio.git
    from: 2.0.0
  swift-nio-ssl:
    url: https://github.com/apple/swift-nio-ssl.git
    from: 2.0.0
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    from: 0.9.0
  minimuxer:
    path: Dependencies/minimuxer

targets:
  PaxHeartbeatTest:
    type: application
    platform: iOS
    sources:
      - path: Sources
    dependencies:
      - package: swift-nio
        product: NIO
      - package: swift-nio-ssl
        product: NIOSSL
      - package: ZIPFoundation
        product: ZIPFoundation
      - framework: Libraries/IDeviceFFI.xcframework
        embed: false
      - package: minimuxer
        product: Minimuxer
    info:
      path: Sources/Info.plist
      properties:
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "9"
        UILaunchScreen: {}
        UIBackgroundModes:
          - audio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pax.heartbeattest
        SWIFT_VERSION: "5.0"
        CODE_SIGN_ENTITLEMENTS: Sources/PaxHeartbeatTest.entitlements
